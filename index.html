<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NITW Road Safety Quiz</title>
<style>
:root {
  --navy:#123b74; --blue:#1e63b5; --light:#eef6ff; --yellow:#ffd84d; --red:#e84545; --green:#159947; --text:#132034; --card:#ffffffee;
}
*{box-sizing:border-box}
body{margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--text); background:linear-gradient(180deg,#d9ecff 0%,#f6fbff 45%,#eef6ff 100%); min-height:100vh;}
body::before{content:""; position:fixed; inset:0; pointer-events:none; opacity:.14; background-image: radial-gradient(circle at 15% 20%, #7ab7ff 0, transparent 25%), radial-gradient(circle at 85% 15%, #b6d8ff 0, transparent 20%), linear-gradient(135deg, transparent 0 47%, rgba(30,99,181,.08) 48% 52%, transparent 53%), linear-gradient(0deg, rgba(18,59,116,.06), rgba(18,59,116,.06));}
.container{max-width:1000px; margin:0 auto; padding:20px; position:relative; z-index:1;}
.hero{text-align:center; padding:20px 16px 10px;}
.hero img{width:86px; height:86px; object-fit:contain; background:white; border-radius:16px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.12);}
.hero h1{margin:14px 0 6px; font-size:clamp(1.9rem,4vw,3rem); color:var(--navy);}
.hero p{margin:0 auto; max-width:760px; line-height:1.55; color:#25496f;}
.badge{display:inline-block; margin-top:10px; padding:8px 14px; background:var(--yellow); color:#111; font-weight:700; border-radius:999px;}
.card{background:var(--card); backdrop-filter:blur(8px); border:1px solid #d8e6f7; border-radius:20px; box-shadow:0 12px 30px rgba(20,58,110,.12); padding:22px; margin:20px 0;}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;}
.field label{display:block; font-weight:700; margin-bottom:6px;}
.field input,.field select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid #b7cde8; font-size:1rem; background:#fff;}
.checkbox-group{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:8px;}
.checkbox-group label{display:flex; align-items:center; gap:8px; font-weight:500; padding:10px; border:1px solid #cfe0f6; border-radius:12px; background:white;}
.actions{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:18px;}
button{border:none; cursor:pointer; border-radius:14px; padding:14px 22px; font-weight:800; font-size:1rem;}
.primary{background:var(--blue); color:white;}
.secondary{background:#e8f1fc; color:var(--navy);}
.danger{background:var(--red); color:white;}
.small{font-size:.92rem; padding:11px 16px;}
.quiz-header{display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:8px;}
.progress{font-weight:700; color:var(--navy);}
.question-card{padding:20px; border:1px solid #d9e7f7; border-radius:18px; background:white; margin:16px 0;}
.question-card h3{margin:0 0 14px; font-size:1.13rem; line-height:1.45;}
.sign-visual{display:flex;justify-content:center;align-items:center;padding:5px 0 15px}.options{display:grid; gap:10px;}
.option{padding:12px 14px; border-radius:12px; border:1px solid #cfddef; background:#f8fbff; display:flex; gap:10px; align-items:flex-start;}
.option input{margin-top:3px;}
.hidden{display:none !important;}
.result-box{text-align:center;}
.score{font-size:3rem; color:var(--navy); font-weight:900; margin:.2em 0;}
.note{font-size:.94rem; color:#50637b; line-height:1.5;}
.table-wrap{overflow:auto; margin-top:16px;}
table{width:100%; border-collapse:collapse; background:white; border-radius:16px; overflow:hidden;}
th,td{border:1px solid #dbe7f5; padding:10px; text-align:left; font-size:.93rem;}
th{background:#edf4fd; color:var(--navy);}
.footer-note{font-size:.9rem; color:#567; margin-top:14px; text-align:center;}
@media (max-width:680px){ .card{padding:16px} .question-card{padding:16px} button{width:100%;} }
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <img src="nitw_logo.png" alt="NIT Warangal logo">
    <h1>Can You Pass This Road Safety Test?</h1>
</section>

  <section id="startScreen" class="card">
    <h2 style="margin-top:0;color:var(--navy)">Participant Details</h2>
    <div class="grid">
      <div class="field"><label for="name">Name</label><input id="name" type="text" placeholder="Enter your name"></div>
      <div class="field"><label for="age">Age</label><input id="age" type="number" min="10" max="100" placeholder="Enter age"></div>
      <div class="field"><label for="gender">Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></div>
      <div class="field"><label for="experience">Driving experience</label><select id="experience"><option value="">Select</option><option>None</option><option>Less than 1 year</option><option>1–3 years</option><option>3–5 years</option><option>More than 5 years</option></select></div>
    </div>
    <div class="field" style="margin-top:16px;">
      <label>Type of vehicles you usually drive / ride</label>
      <div class="checkbox-group" id="vehicleGroup">
        <label><input type="checkbox" value="Two-wheeler"> Two-wheeler</label>
        <label><input type="checkbox" value="Three-wheeler"> Three-wheeler</label>
        <label><input type="checkbox" value="Car / 4-wheeler"> Car / 4-wheeler</label>
        <label><input type="checkbox" value="LMV / Van"> LMV / Van</label>
        <label><input type="checkbox" value="Truck / Bus"> Truck / Bus</label>
        <label><input type="checkbox" value="None"> None</label>
      </div>
    </div>
    <div class="actions">
      <button class="primary" onclick="startQuiz()">Start Quiz</button>
    </div>
    <p class="footer-note">Your answers will be saved in this browser on this device. This practice quiz is not an official RTO test.</p>
  </section>

  <section id="quizScreen" class="card hidden">
    <div class="quiz-header">
      <h2 style="margin:0;color:var(--navy)">Quiz Questions</h2>
      <div class="progress" id="progressText"></div>
    </div>
    <div id="quizContainer"></div>
    <div class="actions">
      <button class="primary" onclick="submitQuiz()">Submit Quiz</button>
      <button class="secondary" onclick="scrollToTop()">Back to Top</button>
    </div>
  </section>

  <section id="resultScreen" class="card hidden">
    <div class="result-box">
      <h2 style="margin-top:0;color:var(--navy)">Quiz Result</h2>
      <div class="score" id="scoreText">0 / 10</div>
      <p id="resultSummary"></p>
      <div class="actions">
        <button class="primary" onclick="restartQuiz()">Try Again</button>
        <button class="secondary" onclick="toggleReview()">Show Answer Review</button>
      </div>
      <p class="note">Thank you for participating in road safety awareness.</p><p class="note" id="saveStatus" role="status" aria-live="polite"></p>
    </div>
    <div id="reviewBox" class="hidden"></div>
  </section>

</div>

<script>
const questionBank = [{"q": "In India, vehicles are normally driven on which side of the road?", "options": ["Left side", "Right side", "Centre of the road", "Either side when traffic is light"], "answer": "Left side"}, {"q": "What should you do when a traffic signal turns red?", "options": ["Proceed if no vehicle is approaching", "Stop before the stop line, unless directed otherwise by an authorised person", "Stop on the pedestrian crossing", "Sound the horn and proceed carefully"], "answer": "Stop before the stop line, unless directed otherwise by an authorised person"}, {"q": "What is the general minimum age to apply for a learner's licence for a private motor vehicle with an engine capacity above 50 cc?", "options": ["16 years", "17 years", "18 years", "21 years"], "answer": "18 years"}, {"q": "What does this traffic sign indicate?", "options": ["No entry for vehicles from this direction", "No parking on either side of the road", "Give way to traffic on the main road", "Maximum speed 50 km/h"], "answer": "No entry for vehicles from this direction", "sign": "no-entry"}, {"q": "Which statement about motorcycle helmets is correct under Indian law, subject to applicable exemptions?", "options": ["A helmet should meet applicable standards and be properly fastened", "Only the rider needs a helmet; the pillion never does", "A helmet is needed only on highways", "Carrying a helmet is sufficient; it need not be worn"], "answer": "A helmet should meet applicable standards and be properly fastened"}, {"q": "Before changing lanes, what is the safest sequence?", "options": ["Signal and move immediately", "Check mirrors and blind spot, signal, then move only when safe", "Sound the horn and change lanes", "Brake sharply before checking traffic"], "answer": "Check mirrors and blind spot, signal, then move only when safe"}, {"q": "What should you do when approaching a school-zone warning sign?", "options": ["Maintain speed until children step onto the road", "Reduce speed, watch for children and be ready to stop", "Overtake vehicles slowing near the school", "Use the horn continuously and continue"], "answer": "Reduce speed, watch for children and be ready to stop"}, {"q": "At an uncontrolled intersection, two vehicles arrive at approximately the same time. In general, which vehicle has priority under the applicable Indian driving rules?", "options": ["The vehicle approaching from the left in every case", "The vehicle approaching from the right, subject to signs and specific priority rules", "The larger vehicle regardless of direction", "The vehicle travelling faster"], "answer": "The vehicle approaching from the right, subject to signs and specific priority rules"}, {"q": "A continuous solid centre line is on your side of the road. What should you do?", "options": ["Cross it to overtake if the vehicle ahead is slow", "Do not cross it except where applicable law and markings permit", "Cross it whenever visibility is good", "Cross it after sounding the horn"], "answer": "Do not cross it except where applicable law and markings permit"}, {"q": "What does this warning sign mean?", "options": ["The road may be slippery; reduce speed and avoid sudden manoeuvres", "Vehicles must stop and inspect the road", "The road is closed to all traffic", "Overtaking is compulsory"], "answer": "The road may be slippery; reduce speed and avoid sudden manoeuvres", "sign": "slippery"}, {"q": "Pedestrians are waiting at a zebra crossing. What is the safest action?", "options": ["Continue unless a pedestrian has already stepped in front of you", "Slow down and stop when necessary to let them cross safely", "Sound the horn so pedestrians wait", "Stop only if a traffic officer is present"], "answer": "Slow down and stop when necessary to let them cross safely"}, {"q": "An ambulance on emergency duty approaches with its warning signals operating. What should you do?", "options": ["Accelerate to stay ahead of it", "Give way safely as soon as practicable without creating another hazard", "Stop immediately in the middle of the junction", "Follow closely behind it"], "answer": "Give way safely as soon as practicable without creating another hazard"}, {"q": "What does this circular sign displaying '50' generally mean?", "options": ["Maximum permitted speed is 50 km/h, subject to other restrictions and conditions", "Recommended minimum speed is 50 km/h", "Drive at exactly 50 km/h in all conditions", "A destination is 50 km away"], "answer": "Maximum permitted speed is 50 km/h, subject to other restrictions and conditions", "sign": "speed-50"}, {"q": "In heavy rain, visibility and tyre grip are reduced. What should you do?", "options": ["Increase following distance, reduce speed and use lights appropriate to conditions", "Follow the vehicle ahead more closely", "Use high beam continuously, even if it dazzles others", "Brake sharply whenever water is visible"], "answer": "Increase following distance, reduce speed and use lights appropriate to conditions"}, {"q": "When entering a roundabout, what is the safest general approach?", "options": ["Enter at normal speed because entering traffic has priority", "Slow down and give way to traffic already circulating, following signs and markings", "Stop inside the roundabout to decide your exit", "Change lanes without checking because traffic moves one way"], "answer": "Slow down and give way to traffic already circulating, following signs and markings"}, {"q": "What does this sign indicate?", "options": ["Parking is restricted in the area indicated, subject to applicable exceptions", "Parking is permitted if hazard lights are on", "Stopping briefly is prohibited everywhere in the city", "The area is reserved for motorcycles"], "answer": "Parking is restricted in the area indicated, subject to applicable exceptions", "sign": "no-parking"}, {"q": "Why is using a hand-held mobile phone while driving dangerous?", "options": ["It can divert attention and delay hazard detection and reaction", "It affects fuel economy but not safety", "It is safe whenever the vehicle is moving slowly", "It improves awareness because the driver checks the screen frequently"], "answer": "It can divert attention and delay hazard detection and reaction"}, {"q": "A learner's licence holder drives a car on a public road. Which statement is generally correct?", "options": ["The learner may drive alone after sufficient practice", "The learner must comply with licence conditions, including required supervision and 'L' display", "A learner may drive any vehicle class if an adult is present", "Learner conditions apply only on national highways"], "answer": "The learner must comply with licence conditions, including required supervision and 'L' display"}, {"q": "What is the correct response to this STOP sign at a junction?", "options": ["Slow down and continue if the junction appears empty", "Stop at the stop line or appropriate position, check traffic, and proceed only when safe", "Stop only when turning right", "Give way without stopping if no vehicle is visible"], "answer": "Stop at the stop line or appropriate position, check traffic, and proceed only when safe", "sign": "stop"}, {"q": "What does this GIVE WAY sign require?", "options": ["Yield to traffic with priority and stop if necessary", "Always proceed first when travelling straight", "Stop for a fixed period even when the road is clear", "Give way only to larger vehicles"], "answer": "Yield to traffic with priority and stop if necessary", "sign": "give-way"}, {"q": "At night on an undivided road, an oncoming vehicle approaches while your high beam is on. What should you do?", "options": ["Keep high beam on so the other driver sees you", "Dip to low beam in good time and maintain safe speed and lane position", "Switch off all lights until it passes", "Look directly at the oncoming headlights"], "answer": "Dip to low beam in good time and maintain safe speed and lane position"}, {"q": "You are following a heavy vehicle and cannot see the road ahead clearly. When should you overtake?", "options": ["Immediately, after sounding the horn", "Only when you have a clear view, sufficient distance and legal permission to complete the manoeuvre safely", "By using the shoulder if the opposing lane is not visible", "When you are close enough to see around the vehicle"], "answer": "Only when you have a clear view, sufficient distance and legal permission to complete the manoeuvre safely"}, {"q": "Warning signals are active at an ungated railway crossing. What should you do?", "options": ["Cross quickly if you cannot see a train", "Stop before the crossing and proceed only when signals permit and it is safe", "Follow the vehicle ahead without checking", "Stop on the tracks to look both ways"], "answer": "Stop before the crossing and proceed only when signals permit and it is safe"}, {"q": "Your vehicle begins to aquaplane on a wet road. What is the safest response?", "options": ["Brake hard and steer sharply", "Ease off the accelerator, keep steering smooth and avoid sudden braking until grip returns", "Accelerate firmly to cut through the water", "Apply the parking brake gradually"], "answer": "Ease off the accelerator, keep steering smooth and avoid sudden braking until grip returns"}, {"q": "A queue beyond a junction means there is no space for your vehicle to clear the intersection, although the signal is green. What should you do?", "options": ["Enter because green always means the junction is clear", "Wait before the junction until there is space to clear it without blocking cross traffic", "Stop on the pedestrian crossing", "Use the opposing lane to bypass the queue"], "answer": "Wait before the junction until there is space to clear it without blocking cross traffic"}, {"q": "What does this warning sign indicate?", "options": ["A narrow bridge is ahead; slow down and follow priority signs or traffic control", "The bridge has no load restrictions", "Overtaking is required before the bridge", "The road ends immediately at the bridge"], "answer": "A narrow bridge is ahead; slow down and follow priority signs or traffic control", "sign": "narrow-bridge"}, {"q": "You arrive first at a crash scene where someone is injured. What is the most appropriate response?", "options": ["Leave if the injured person appears conscious", "Arrange prompt medical assistance and fulfil applicable legal duties to report and cooperate", "Move every injured person immediately regardless of possible injuries or danger", "Wait until fault has been determined before calling for help"], "answer": "Arrange prompt medical assistance and fulfil applicable legal duties to report and cooperate"}, {"q": "When descending a long, steep gradient, which technique helps maintain control?", "options": ["Select neutral and coast", "Use an appropriate lower gear and controlled speed; avoid continuous heavy braking", "Keep the clutch depressed throughout", "Switch off the engine and rely on the brakes"], "answer": "Use an appropriate lower gear and controlled speed; avoid continuous heavy braking"}, {"q": "A centre line is solid on your side and broken on the opposite side. What does this generally mean?", "options": ["You may cross because the opposite side is broken", "You must not cross the solid line on your side; the broken-line side may cross only when safe and permitted", "Both directions may cross whenever visibility is good", "The marking applies only to parking"], "answer": "You must not cross the solid line on your side; the broken-line side may cross only when safe and permitted"}, {"q": "A driver has consumed alcohol but feels normal. Which statement is correct?", "options": ["Feeling normal proves that driving ability is unaffected", "Alcohol can impair judgement and reaction time; do not drive after consuming alcohol", "Coffee reliably removes alcohol impairment", "Driving slowly makes driving after alcohol safe and lawful"], "answer": "Alcohol can impair judgement and reaction time; do not drive after consuming alcohol"}, {"q": "What does the STOP road sign require?", "options": ["Come to a complete stop", "Slow down without stopping", "Use your horn and continue", "Give way only to trucks"], "answer": "Come to a complete stop", "sign": "stop"}, {"q": "What does the NO ENTRY road sign mean?", "options": ["No entry for vehicles", "No stopping at any time", "Parking prohibited", "Pedestrian area only"], "answer": "No entry for vehicles", "sign": "no-entry"}, {"q": "What does this 40 sign mean?", "options": ["Maximum speed 40 km/h", "Minimum speed 40 km/h", "Road distance 40 km", "Only 40 vehicles allowed"], "answer": "Maximum speed 40 km/h", "sign": "speed-40"}, {"q": "What does this red-slash P sign mean?", "options": ["No parking", "Parking allowed", "Parking for cars only", "Taxi stand"], "answer": "No parking", "sign": "no-parking"}, {"q": "What should you do at this GIVE WAY sign?", "options": ["Yield to traffic with priority", "Drive straight without slowing", "Stop for exactly 10 seconds", "Sound the horn before entering"], "answer": "Yield to traffic with priority", "sign": "give-way"}, {"q": "What does this traffic sign prohibit?", "options": ["Turning left", "Going straight", "Turning right", "Overtaking"], "answer": "Turning left", "sign": "no-left"}, {"q": "At a zebra crossing, pedestrians are already crossing. What should you do?", "options": ["Stop and let them cross", "Sound your horn and drive through", "Increase speed to pass first", "Stop only for a traffic officer"], "answer": "Stop and let them cross"}, {"q": "Before a car journey, what should occupants do?", "options": ["Fasten seat belts", "Turn on hazard lights", "Open all windows", "Switch on high beams"], "answer": "Fasten seat belts"}, {"q": "What is the correct helmet practice on a motorcycle?", "options": ["Both rider and pillion wear fastened helmets", "Only the rider wears a helmet", "Helmets are optional in city traffic", "A helmet is required only at night"], "answer": "Both rider and pillion wear fastened helmets"}, {"q": "You receive an urgent message while driving. What is safest?", "options": ["Pull over safely before using the phone", "Read it quickly at a red light", "Use the phone if driving slowly", "Ask the passenger to take the wheel"], "answer": "Pull over safely before using the phone"}, {"q": "What should you do at an uncontrolled junction with a blocked view?", "options": ["Slow down until you can see it is safe", "Accelerate to cross quickly", "Keep to the opposite lane", "Sound the horn and proceed without looking"], "answer": "Slow down until you can see it is safe"}, {"q": "A truck is turning left. Where should a scooter rider avoid riding?", "options": ["In the narrow gap along the truck's left side", "Well behind the truck", "At a safe distance from the junction", "Where the truck driver can see clearly"], "answer": "In the narrow gap along the truck's left side"}, {"q": "Why should you avoid cutting closely in front of a heavy truck?", "options": ["Its driver needs more distance to stop", "It can always stop immediately", "It is safer than staying behind", "Trucks have no front blind spots"], "answer": "Its driver needs more distance to stop"}, {"q": "A bus is stopped and passengers may step out. What is safest?", "options": ["Slow down and watch for pedestrians", "Overtake fast before people cross", "Sound the horn continuously", "Drive close to the bus"], "answer": "Slow down and watch for pedestrians"}, {"q": "What should you do when a traffic signal turns yellow?", "options": ["Prepare to stop if safe to do so", "Always accelerate through the junction", "Reverse to the previous junction", "Ignore it if there is no traffic"], "answer": "Prepare to stop if safe to do so"}];
let renderedQuestions = [];
let participant = null;
const STORAGE_KEY = 'nitw_rsf_quiz_responses_v1';
// PASTE YOUR DEPLOYED APPS SCRIPT /exec URL BELOW (not the /dev or spreadsheet URL).
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycT1ggScuWAF1wHQl-vv0kx_OU6xedW734aDO_d1Ar5NZRtCxoTv5BmUz7-v8Rwnxcew/exec';


function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getParticipantData() {
  const vehicles = [...document.querySelectorAll('#vehicleGroup input:checked')].map(cb => cb.value);
  return { name: document.getElementById('name').value.trim(), age: document.getElementById('age').value.trim(), gender: document.getElementById('gender').value, experience: document.getElementById('experience').value, vehicleTypes: vehicles.join(', ') };
}
function startQuiz() {
  participant = getParticipantData();
  if (!participant.age || !participant.gender || !participant.experience) { alert('Please fill Age, Gender and Driving Experience before starting the quiz.'); return; }
  const signQs=shuffle(questionBank.filter(q=>q.sign)).slice(0,3);
  const otherQs=shuffle(questionBank.filter(q=>!q.sign)).slice(0,7);
  renderedQuestions=shuffle([...signQs,...otherQs]).map((q,idx)=>({...q,order:idx+1,optionsShuffled:shuffle(q.options)}));
  renderQuiz();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function signMarkup(id) {
 if (!id) return '';
 const c = {
 'stop':'<polygon points="44,7 76,7 93,24 93,56 76,73 44,73 27,56 27,24" fill="#df2533" stroke="white" stroke-width="3"/><text x="60" y="49" fill="white" text-anchor="middle" font-size="20" font-weight="900">STOP</text>',
 'no-entry':'<circle cx="60" cy="40" r="34" fill="#df2634"/><rect x="38" y="34" width="44" height="12" rx="2" fill="white"/>',
 'speed-40':'<circle cx="60" cy="40" r="33" fill="white" stroke="#df2634" stroke-width="10"/><text x="60" y="54" fill="#141414" text-anchor="middle" font-size="37" font-weight="800">40</text>',
 'speed-50':'<circle cx="60" cy="40" r="33" fill="white" stroke="#df2634" stroke-width="10"/><text x="60" y="54" fill="#141414" text-anchor="middle" font-size="37" font-weight="800">50</text>',
 'no-parking':'<circle cx="60" cy="40" r="33" fill="white" stroke="#df2634" stroke-width="9"/><text x="60" y="57" fill="#141414" text-anchor="middle" font-size="51" font-weight="800">P</text><path d="M38 17 L82 63" stroke="#df2634" stroke-width="8"/>',
 'give-way':'<polygon points="60,77 20,10 100,10" fill="white" stroke="#df2634" stroke-width="9" stroke-linejoin="round"/>',
 'no-left':'<circle cx="60" cy="40" r="33" fill="white" stroke="#df2634" stroke-width="9"/><path d="M82 60 L82 42 Q82 29 66 29 L40 29 M40 29 L52 18 M40 29 L52 40" fill="none" stroke="#151515" stroke-width="7" stroke-linejoin="round"/><path d="M38 15 L82 65" stroke="#df2634" stroke-width="8"/>',
 'slippery':'<polygon points="60,5 107,78 13,78" fill="#fff" stroke="#df2634" stroke-width="8" stroke-linejoin="round"/><path d="M44 46 q10 -15 18 0 q10 15 17 -1" stroke="#151515" fill="none" stroke-width="4"/><path d="M37 62q10 -13 17 0M67 62q10 -13 18 0" stroke="#151515" fill="none" stroke-width="3"/>',
 'narrow-bridge':'<polygon points="60,5 107,78 13,78" fill="#fff" stroke="#df2634" stroke-width="8" stroke-linejoin="round"/><path d="M42 34v32 M78 34v32 M42 44h36 M42 57h36" stroke="#151515" fill="none" stroke-width="5"/>'
 };
 return c[id] ? '<div class="sign-visual"><svg width="136" height="96" viewBox="0 0 120 86" aria-label="Traffic sign illustration" role="img">'+c[id]+'</svg></div>' : '';
}

function renderQuiz() {
  const el = document.getElementById('quizContainer');
  document.getElementById('progressText').textContent = `${renderedQuestions.length} questions`;
  el.innerHTML = renderedQuestions.map((q, idx) => `
    <div class="question-card" id="card_${idx}">
      <h3>${idx+1}. ${escapeHtml(q.q)}</h3>
      ${signMarkup(q.sign)}
      <div class="options">
        ${q.optionsShuffled.map(opt => `
          <label class="option"><input type="radio" name="q${idx}" value="${escapeHtml(opt)}"> <span>${escapeHtml(opt)}</span></label>
        `).join('')}
      </div>
    </div>
  `).join('');
}
function submitQuiz() {
  let score = 0;
  const answers = [];
  renderedQuestions.forEach((q, idx) => {
    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    const userAnswer = selected ? selected.value : '';
    const isCorrect = userAnswer === q.answer;
    if (isCorrect) score++;
    answers.push({question:q.q, correctAnswer:q.answer, userAnswer, isCorrect});
  });
  const record = { timestamp:new Date().toISOString(), ...participant, score, total:renderedQuestions.length, percentage:Math.round((score/renderedQuestions.length)*100), answers };
  saveResponse(record); // Local backup on this device; never displayed to participants.
  sendToGoogleSheet(record);
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('scoreText').textContent = `${score} / ${renderedQuestions.length}`;
  document.getElementById('resultSummary').textContent = `${participant.name || 'Participant'}, your score is ${Math.round((score / renderedQuestions.length) * 100)}%.`;
  buildReview(answers); window.scrollTo({top:0, behavior:'smooth'});
}
function buildReview(answers) {
  const review = document.getElementById('reviewBox');
  review.innerHTML = '<h3 style="color:var(--navy)">Answer Review</h3>' + answers.map((a, i) => `
    <div class="question-card"><h3>${i+1}. ${escapeHtml(a.question)}</h3><p><b>Your answer:</b> <span style="color:${a.isCorrect ? '#159947' : '#c53030'}">${escapeHtml(a.userAnswer || 'Not answered')}</span></p><p><b>Correct answer:</b> <span style="color:#159947">${escapeHtml(a.correctAnswer)}</span></p></div>
  `).join('');
  review.classList.add('hidden');
}
function toggleReview() { document.getElementById('reviewBox').classList.toggle('hidden'); }
function escapeHtml(str) { return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'", '&#39;'); }

async function sendToGoogleSheet(record) {
  const status = document.getElementById('saveStatus');
  if (!GOOGLE_SCRIPT_URL.startsWith('https://script.google.com/macros/s/') || !GOOGLE_SCRIPT_URL.endsWith('/exec')) {
    status.textContent = 'Your score is shown above. Online collection is not configured yet; a local copy was saved on this device.';
    return;
  }
  if (!navigator.onLine) {
    status.textContent = 'You appear offline. Your answers were saved on this device, but not uploaded to the organizer.';
    return;
  }
  status.textContent = 'Sending your entry to the organizer…';
  try {
    // Apps Script web apps generally cannot return readable CORS responses to GitHub Pages.
    // mode: no-cors sends the POST, but cannot verify that Sheets accepted the data.
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({event: 'NITW_Technozion_2026', record})
    });
    status.textContent = 'Your quiz is complete. Submission was sent; final receipt cannot be verified in this browser.';
  } catch(err) {
    status.textContent = 'Online submission could not be sent. Your answers are saved only on this device. Please inform the stall organizer.';
  }
}

function getStoredResponses() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; } }
function saveResponse(record) { const data=getStoredResponses(); data.push(record); localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function restartQuiz() { document.getElementById('resultScreen').classList.add('hidden'); document.getElementById('startScreen').classList.remove('hidden'); document.getElementById('quizScreen').classList.add('hidden'); window.scrollTo({top:0, behavior:'smooth'}); }
function scrollToTop() { window.scrollTo({top:0, behavior:'smooth'}); }
</script>
